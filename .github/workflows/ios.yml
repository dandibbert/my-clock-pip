name: iOS Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test clock and SNTP core
        run: swift test
      - name: Generate native Xcode project and app icons
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift scripts/GenerateIcon.swift
          xcodegen generate
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Build and test on iOS simulator
        run: |
          set -o pipefail
          xcodebuild test -project MyClockPiP.xcodeproj -scheme MyClockPiP \
            -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath build-sim -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee simulator-build.log
      - name: Capture the running app
        run: |
          mkdir -p screenshots
          xcrun simctl status_bar '${{ steps.simulator.outputs.id }}' override --time '09:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.dandibbert.myclockpip --uitesting
          sleep 3
          xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot screenshots/home.png
      - name: Build unsigned iPhone and iPad app
        run: |
          set -o pipefail
          xcodebuild build -project MyClockPiP.xcodeproj -scheme MyClockPiP \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tee device-build.log
          bash scripts/package_ipa.sh build-device/Build/Products/Release-iphoneos/MyClockPiP.app dist
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyClockPiP-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload test results and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: |
            TestResults.xcresult
            *-build.log
          if-no-files-found: ignore
          retention-days: 7
